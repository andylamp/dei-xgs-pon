minimum_prek_version: "0.5.10"
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
exclude: ^(?:dist/|local/|\.venv/)

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/fixtures/(?:guide|v[^/]+)/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/(?:guide|v[^/]+)/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/fixtures/(?:guide|v[^/]+)/
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock consistency
        entry: uv lock --check
        language: system
        files: ^(?:pyproject\.toml|uv\.lock|\.python-version)$
        pass_filenames: false

      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
        files: ^(?:scripts|tests)/

      - id: ruff-format
        name: Ruff formatting
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
        files: ^(?:scripts|tests)/

      - id: ty
        name: ty type checking
        entry: uv run --locked ty check
        language: system
        files: ^(?:(?:scripts|tests)/.*\.py|pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: shfmt
        name: POSIX shell formatting
        entry: uv run --locked shfmt -w -ln posix -i 4 -ci
        language: system
        files: ^(?:src|tools)/.*\.sh$

      - id: shellcheck
        name: ShellCheck and BusyBox syntax
        entry: make validate-generated
        language: system
        files: ^(?:(?:src|tools)/.*\.sh|scripts/(?:build_installer|check_shell)\.py|\.shellcheckrc|Makefile|compat/previous-runtime-hashes\.json)$
        pass_filenames: false

      - id: markdown
        name: Markdown lint
        entry: uv run --locked pymarkdown scan
        language: system
        types: [markdown]

      - id: actionlint
        name: GitHub Actions lint
        entry: uv run --locked actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: fixture-integrity
        name: Historical fixture integrity
        entry: uv run --locked python scripts/check_fixtures.py
        language: system
        files: ^(?:tests/fixtures/|compat/previous-runtime-hashes\.json$|scripts/check_fixtures\.py$)
        pass_filenames: false
