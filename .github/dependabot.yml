version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  # Keep tool.uv.required-version compatible with the uv bundled by this updater.
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
